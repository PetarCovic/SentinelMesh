server:
  port: 8080

spring:
  application:
    name: sentinelmesh-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelmesh
    username: postgres
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true	

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  version: 0.1.0