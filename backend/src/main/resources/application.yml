server:
  port: 8080

spring:
  application:
    name: sentinelmesh-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelmesh
    username: postgres
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sentinelmesh:
  snapshots:
    storage-root: storage/snapshots
    max-file-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png

  clips:
    storage-root: storage/clips
    max-file-size-bytes: 52428800
    allowed-content-types:
      - video/mp4
    default-duration-seconds: 15
    default-width: 0
    default-height: 0

  recordings:
    storage-root: storage/recordings
    max-file-size-bytes: 104857600
    allowed-content-types:
      - video/mp4
    default-duration-seconds: 15
    default-width: 0
    default-height: 0

app:
  version: 0.1.0