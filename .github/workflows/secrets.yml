name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        run: |
          gitleaks_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")"
          gitleaks_archive="${gitleaks_dir}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$gitleaks_archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$gitleaks_archive" | sha256sum --check --strict
          tar -xzf "$gitleaks_archive" -C "$gitleaks_dir" gitleaks
          chmod +x "${gitleaks_dir}/gitleaks"
          echo "$gitleaks_dir" >> "$GITHUB_PATH"

      - name: Scan all reachable history
        run: >-
          gitleaks git
          --config .gitleaks.toml
          --no-banner
          --redact=100
          --verbose
          --log-opts="--all --full-history"
          .
